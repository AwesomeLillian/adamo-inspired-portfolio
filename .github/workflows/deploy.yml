name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: List build output
        run: |
          echo "--- checking dist ---"
          ls -la dist || echo "no dist"
          echo "--- checking.output ---"
          ls -la.output || echo "no.output"
          echo "--- checking.output/public ---"
          ls -la.output/public || echo "no.output/public"
          echo "--- copying to dist ---"
          mkdir -p dist
          if [ -d ".output/public" ]; then cp -r.output/public/* dist/; fi
          ls -la dist
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
